<button id="feedback-launcher" class="button primary feedback-launcher" type="button" aria-expanded="false" aria-controls="feedback-panel">
  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 3v-3a2 2 0 0 1-2-2V7a3 3 0 0 1 3-3ZM7 9h10M7 13h6"/></svg>Feedback
</button>
<section id="feedback-panel" class="panel feedback-panel" aria-labelledby="feedback-title" hidden>
  <div class="feedback-header"><h2 id="feedback-title">Feedback</h2><button id="feedback-close" class="text-button feedback-close" type="button" aria-label="Close feedback">×</button></div>
  <form id="feedback-form" action="{{ url_for('feedback_send') }}" method="post" autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="feedback-text">What would you like to share?</label>
    <textarea id="feedback-text" name="text" rows="5" maxlength="5000" required placeholder="A suggestion, question, or issue…"></textarea>
    <div class="feedback-actions"><a class="text-link" href="{{ url_for('feedback_inbox') }}">Feedback inbox</a><button class="button primary" type="submit">Send</button></div>
    <p class="feedback-status" role="status" aria-live="polite"></p>
  </form>
</section>
